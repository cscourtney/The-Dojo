<!doctype html><html><meta charset="utf-8"><title>Dojo synthetic AI check</title><script src="https://accounts.google.com/gsi/client" async defer></script><body><h1>Dojo synthetic AI check</h1><p>This check sends one fictional practice note. It does not load or send journal entries, course imports, or paid teaching.</p><button id="run">Run synthetic AI check</button><p id="state" role="status"></p><pre id="result"></pre><script type="module">
import {ensureAccess,accessToken} from '../next/js/sheets.js?v=18';
document.getElementById('run').onclick=async()=>{const state=document.getElementById('state');try{state.textContent='Checking connection…';const base='https://yhe-dojo-next.livingthesearch1.workers.dev';const cap=await fetch(base+'/sensei-status');const data=await cap.json();if(!data.sensei)throw Error('Service not ready');await ensureAccess();state.textContent='Running synthetic example…';const body={mode:'course',question:'This is a fictional test, not my training. Explain the practice idea in the synthetic source, without attributing it to an instructor.',sources:[{id:'S1',kind:'ai_interpreted_course_note',title:'Synthetic practice example — not purchased content',content:'In this fictional exercise the participant first establishes balance, then attempts a movement, and returns to a stable position after each attempt.',evidence:'Fictional test data. No real person, course or instructor is represented.'}]};const response=await fetch(base+'/ask-sensei',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+accessToken()},body:JSON.stringify(body),signal:AbortSignal.timeout(75000)});const result=await response.json();if(!response.ok)throw Error(result.error||String(response.status));document.getElementById('result').textContent=JSON.stringify(result.answer,null,2);state.textContent='PASS: authenticated AI response using synthetic evidence only.';}catch(error){state.textContent='Check stopped: '+error.message;}};
</script></body></html>
